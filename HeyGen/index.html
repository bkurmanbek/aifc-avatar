<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIFC Avatar — HeyGen LiveAvatar (Sulafat)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #dce8ff;
        display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px;
      }
      h1 { font-size: 15px; font-weight: 700; opacity: 0.85; margin: 4px 0; }
      #stage {
        position: relative; width: min(540px, 92vw); aspect-ratio: 9 / 16;
        border-radius: 20px; overflow: hidden; background: #060912;
        box-shadow: 0 24px 70px rgba(0,0,0,0.5);
      }
      #avatar { width: 100%; height: 100%; object-fit: cover; background: #060912; }
      .row { display: flex; gap: 8px; width: min(540px, 92vw); }
      input, button {
        font: inherit; border-radius: 10px; border: 1px solid #2a3553; background: #131b30;
        color: #dce8ff; padding: 10px 12px;
      }
      #text { flex: 1; }
      button { cursor: pointer; font-weight: 600; }
      button.primary { background: #2d6df6; border-color: #2d6df6; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { font-size: 12px; opacity: 0.7; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>AIFC Avatar — HeyGen LiveAvatar · Sulafat voice</h1>
    <div id="stage"><video id="avatar" autoplay playsinline></video></div>
    <div class="row">
      <button id="start" class="primary" type="button">Start</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <div class="row">
      <input id="text" type="text" placeholder="Type something for the avatar to say…" disabled />
      <button id="speak" type="button" disabled>Speak</button>
    </div>
    <div id="status">Idle. Click Start to open a LiveAvatar session.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
